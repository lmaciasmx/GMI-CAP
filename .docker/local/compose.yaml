name: ${COMPOSE_PROJECT_NAME:-gmi-proyecto-demo}
services:
  php:
    build:
      context: ../..
      dockerfile: .docker/local/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ../../:/var/www/html
   
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    volumes:
      - ../../:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configura MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  db_data:
